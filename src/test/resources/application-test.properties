# 테스트 전용 설정 (@ActiveProfiles("test")일 때만 적용)
# 실제 DB·외부 API·비밀키 없이 ApplicationContext가 뜨는지 확인하기 위한 값들입니다.

# DB: 메모리 H2 (MySQL 호환 모드)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# 메인 설정의 MySQLDialect를 덮어쓰기 위해 명시 (HHH90000025 경고는 무시해도 됨)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# JWT (HS256은 32바이트 이상 필요)
secret-key=test-secret-key-for-unit-tests-only-0123456789abcdef
json-key=test-json-key

# SSL: 테스트에서는 keystore 없이 실행
server.ssl.enabled=false

# 메일
spring.mail.username=test@example.com
spring.mail.password=test

# 외부 API
naver.client.id=test
naver.client.secret=test
google.api.key=test
tour.api.key=test

# S3
cloud.aws.credentials.accessKey=test
cloud.aws.credentials.secretKey=test

# Kakao OAuth2
spring.security.oauth2.client.registration.kakao.client-id=test
spring.security.oauth2.client.registration.kakao.client-secret=test
