plugins {
    id 'java'
    id 'org.springframework.boot' version '4.2.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.hibernate.orm' version '7.4.15.Final'
    id 'org.graalvm.buildtools.native' version '1.1.18'
}

group = 'com.multicampus'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    //SPRING
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    //JWT
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    //TEST
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    //DATABASE
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'

	//SWAGGER
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'

    //MYBATIS
    implementation group: 'org.mybatis.spring.boot', name: 'mybatis-spring-boot-starter', version: '4.1.0'

    //JACKSON 2 (외부 API 응답 파싱용: AsyncGoogleService, Tour4_0Service, WeatherService)
    //Spring MVC는 Boot 4 기본값인 Jackson 3를 사용
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    //MAIL
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    //OAUTH2, VALIDATION (이메일 인증인가)
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    //S3
    implementation platform('software.amazon.awssdk:bom:2.59.4')
    implementation 'software.amazon.awssdk:s3'

    //자동 재시작 및 라이브 리로드
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

}

hibernate {
    enhancement {
        enableAssociationManagement = true
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile) {
    options.compilerArgs << "-parameters"

}
